name: Backend CI

on:
  push:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tooang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tooang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tooang_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tooang_test
      JWT_ACCESS_TOKEN: ci-access-secret
      JWT_REFRESH_TOKEN: ci-refresh-secret
      JWT_ACCESS_TOKEN_EXPIRE: 15m
      JWT_REFRESH_TOKEN_EXPIRE: 30d
      JWT_REMEMBER_ME_REFRESH_TOKEN_EXPIRE: 90d
      BCRYPT_ROUNDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npx prisma migrate deploy --config prisma7.config.ts
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:e2e -- --runInBand
